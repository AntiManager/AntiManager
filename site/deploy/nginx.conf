server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers. nginx `add_header` is NOT inherited once a location
    # declares its own, so all shared headers live here and locations only set
    # `expires` (which does not reset the inherited set).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    # Served through the TLS terminator (Caddy) but emitted here since Caddy
    # does not set it; protects the apex host against protocol downgrade.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Language "ru" always;

    # Canonical host: send www to the apex so the two hosts never serve the
    # same content (duplicate-content signal).
    if ($host = www.antimanager.pro) {
        return 301 https://antimanager.pro$request_uri;
    }

    # Custom 404 page, served with the 404 status preserved.
    error_page 404 /404/index.html;

    # Clean URLs: /weapons/<slug>/ → /weapons/<slug>/index.html. Directory
    # requests without a trailing slash get a 301 so /arsenal and /arsenal/ are
    # not two cacheable copies of the same page.
    location / {
        if (-d $request_filename) {
            rewrite ^/(.*[^/])$ /$1/ permanent;
        }
        try_files $uri $uri/index.html $uri.html =404;
    }

    # Static assets — long cache (the HTML cache-busts them with ?v=).
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp|woff2?|xml|txt|pdf|webmanifest)$ {
        expires 7d;
    }

    # HTML — short cache.
    location ~* \.html$ {
        expires 5m;
    }

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/html text/css text/plain application/javascript application/json image/svg+xml;

    server_tokens off;
}
