# Real client IP. TLS terminates at Caddy, a container on the same Docker
# network, so the socket peer nginx sees is Caddy's bridge address. Caddy sets
# X-Forwarded-For; trust it only from private ranges, because nginx is not
# published outside `vps_shared`. Without this, `$remote_addr` is one shared
# address for every visitor, which collapses both the limit_req zone below and
# the service's per-IP limiter into a single global bucket.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Per-IP rate limit shared by the two feedback locations below. This file is
# included from `http {}` (conf.d), which is where nginx requires the zone.
limit_req_zone $binary_remote_addr zone=feedback:10m rate=20r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Emit relative Location headers for nginx-built redirects (e.g. the
    # trailing-slash 301). TLS terminates at Caddy, so nginx only sees http and
    # would otherwise redirect to an http:// URL, adding a hop.
    absolute_redirect off;

    # Security headers. nginx `add_header` is NOT inherited once a location
    # declares its own, so all shared headers live here and locations only set
    # `expires` (which does not reset the inherited set).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    # Served through the TLS terminator (Caddy) but emitted here since Caddy
    # does not set it; protects the apex host against protocol downgrade.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Language "ru" always;

    # Canonical host: send www to the apex so the two hosts never serve the
    # same content (duplicate-content signal).
    if ($host = www.antimanager.pro) {
        return 301 https://antimanager.pro$request_uri;
    }

    # Legacy route map (generated from src/routes.js by npm run gen:redirects).
    # Slash and no-slash variants are matched here so the trailing-slash 301
    # below never turns one legacy URL into two hops.
    include /etc/nginx/redirects.conf;

    # Legacy /strategy/ routes → the articles library (permanent, single hop).
    # Kept outside `location /` so a cached link never hits a 404 after the move.
    location = /strategy {
        return 301 /articles/strategy/;
    }
    rewrite ^/strategy/(.*)$ /articles/strategy/$1 permanent;

    # Custom 404 page, served with the 404 status preserved.
    error_page 404 /404/index.html;

    # Clean URLs: /weapons/<slug>/ → /weapons/<slug>/index.html. Directory
    # requests without a trailing slash get a 301 so /arsenal and /arsenal/ are
    # not two cacheable copies of the same page.
    location / {
        if (-d $request_filename) {
            rewrite ^/(.*[^/])$ /$1/ permanent;
        }
        try_files $uri $uri/index.html $uri.html =404;
    }

    # Feedback form endpoints → the feedback microservice on the shared Docker
    # network (site/feedback/). Same origin, so no CORS is needed. These are
    # `location`s, so the server-level security headers still apply.
    #
    # This file is mounted as conf.d/default.conf, i.e. inside `http {}`, so the
    # limit_req zone is declared at file level (a server block cannot hold it,
    # but http can). The zone is a cheap front layer: the service keeps its own
    # per-IP and global limits, which are authoritative.
    location = /api/feedback {
        limit_req zone=feedback burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite (not append to) the client-supplied forwarding headers so the
        # service's per-IP rate limiter always keys on the real client, never on
        # a spoofed X-Forwarded-For that $proxy_add_x_forwarded_for would keep.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://antimanager-feedback:8080/api/feedback;
        proxy_read_timeout 15s;
    }

    # Proof-of-work challenge for the same form (GET, no body).
    location = /api/feedback/challenge {
        limit_req zone=feedback burst=20 nodelay;
        limit_req_status 429;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://antimanager-feedback:8080/api/feedback/challenge;
        proxy_read_timeout 10s;
    }

    # Pagefind search bundle. `^~` keeps the `.js` regex location below from
    # overriding it (that location only sets expires anyway); no add_header here
    # so the server-level security headers stay inherited.
    location ^~ /pagefind/ {
        expires 5m;
    }

    # Static assets — long cache (the HTML cache-busts them with ?v=).
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp|woff2?|xml|txt|pdf|webmanifest)$ {
        expires 7d;
    }

    # HTML — short cache.
    location ~* \.html$ {
        expires 5m;
    }

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    # text/html is compressed by nginx implicitly; listing it here is a no-op
    # that nginx warns about ("duplicate MIME type"), so it is omitted.
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    server_tokens off;
}
